[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-harness"
version = "0.1.0"
description = "Team Chaos's homemade CLI agent harness"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40.0"]

[project.scripts]
chaos = "chaos.cli:main"

[tool.setuptools.packages.find]
include = ["chaos*"]
