[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-harness"
version = "0.1.0"
description = "Hackathon-specific bring-your-own-model agent CLI, made by Team Chaos"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.0",
    "requests>=2.31",
    "textual>=0.86",
]

[project.scripts]
chaos = "chaos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
